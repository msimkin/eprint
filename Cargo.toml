[package]
name = "eprint"
version = "1.6.0"
edition = "2021"
description = "Search the IACR Cryptology ePrint Archive from the command line"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
quick-xml = "0.36"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde_json = "1"
terminal_size = "0.4"
ureq = "2.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
